<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sin conexión | Brisabel</title>
    <style>
      /* Página estática (la muestra el service worker sin internet): colores de la marca inline. */
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #fbfaf7;
        color: #1d2a1d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 16px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.6rem;
        color: #213521;
      }
      p {
        margin: 0 auto;
        max-width: 22rem;
        line-height: 1.5;
        color: #5d6858;
      }
      button {
        margin-top: 24px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #213521;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="/pwa/icon-192.png" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos a internet. Revisá tu conexión y volvé a intentar.</p>
      <button onclick="location.reload()" type="button">Reintentar</button>
    </main>
  </body>
</html>
